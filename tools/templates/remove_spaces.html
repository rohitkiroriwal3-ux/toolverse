{% extends "base.html" %}

{% block content %}

<style>

.tool-container{
max-width:700px;
margin:auto;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
text-align:center;
}

.tool-container h1{
margin-top:0;
color:#243b64;
}

.text-box{
margin-bottom:20px;
}

.text-box textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
resize:vertical;
}

.tool-btn{
background:#2f5da8;
color:white;
padding:12px 25px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

.tool-btn:hover{
opacity:0.9;
}

.result-box{
margin-top:25px;
padding:15px;
background:#f4f6f9;
border-radius:6px;
font-size:16px;
color:#243b64;
word-break:break-word;
}

/* mobile */

@media (max-width:768px){

.tool-container{
padding:25px;
}

}

</style>


<div class="tool-container">

<h1>✂️ Remove Extra Spaces</h1>

<p>Remove unnecessary spaces from text instantly.</p>

<form method="post">

{% csrf_token %}

<div class="text-box">

<textarea name="text" rows="10" placeholder="Paste your text here...">{{ text }}</textarea>

</div>

<button type="submit" class="tool-btn">
Remove Spaces
</button>

</form>


{% if result %}

<div class="result-box">

<strong>Result:</strong>

<br><br>

{{ result }}

</div>

{% endif %}

</div>

{% endblock %}
