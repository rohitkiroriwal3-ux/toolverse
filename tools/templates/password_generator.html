{% extends "base.html" %}

{% block content %}

<style>

.tool-container{
max-width:600px;
margin:auto;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
text-align:center;
}

.tool-container h1{
margin-top:0;
color:#243b64;
}

.input-box{
margin-bottom:20px;
}

.input-box label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

.input-box input{
width:120px;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
text-align:center;
}

.tool-btn{
background:#2f5da8;
color:white;
padding:12px 25px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

.tool-btn:hover{
opacity:0.9;
}

.result-box{
margin-top:25px;
padding:15px;
background:#f4f6f9;
border-radius:6px;
font-size:18px;
font-weight:bold;
word-break:break-all;
}

/* mobile */

@media (max-width:768px){

.tool-container{
padding:25px;
}

}

</style>


<div class="tool-container">

<h1>🔐 Password Generator</h1>

<p>Create a secure random password instantly.</p>

<form method="post">

{% csrf_token %}

<div class="input-box">

<label>Password Length</label>

<input type="number" name="length" value="12" min="4" max="50">

</div>

<button type="submit" class="tool-btn">
Generate Password
</button>

</form>


{% if password %}

<div class="result-box">

{{ password }}

</div>

{% endif %}

</div>

{% endblock %}
