{% extends "base.html" %}

{% block content %}

<style>

.tool-container{
max-width:650px;
margin:auto;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
text-align:center;
}

.tool-container h1{
margin-top:0;
color:#243b64;
}

.input-box{
margin-bottom:20px;
}

.input-box input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

.tool-btn{
background:#2f5da8;
color:white;
padding:12px 25px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

.tool-btn:hover{
opacity:0.9;
}

.qr-result{
margin-top:25px;
}

.qr-result img{
margin-top:10px;
border:1px solid #ddd;
padding:10px;
background:white;
border-radius:6px;
}

/* mobile */

@media (max-width:768px){

.tool-container{
padding:25px;
}

}

</style>


<div class="tool-container">

<h1>📱 QR Code Generator</h1>

<p>Create QR codes instantly for links, text, or any data.</p>

<form method="post">

{% csrf_token %}

<div class="input-box">

<input
type="text"
name="data"
placeholder="Enter text or link"
required>

</div>

<button type="submit" class="tool-btn">
Generate QR
</button>

</form>


{% if qr_image %}

<div class="qr-result">

<h3>Your QR Code</h3>

<img src="data:image/png;base64,{{ qr_image }}" alt="QR Code">

</div>

{% endif %}

</div>

{% endblock %}
