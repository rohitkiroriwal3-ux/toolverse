{% extends "base.html" %}

{% block content %}

<style>

.tool-container{
max-width:700px;
margin:auto;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
text-align:center;
}

.tool-container h1{
margin-top:0;
color:#243b64;
}

.upload-box{
border:2px dashed #ccc;
padding:30px;
border-radius:8px;
margin-bottom:20px;
background:#fafafa;
}

.upload-box input{
margin-top:10px;
}

.size-inputs{
display:flex;
gap:20px;
justify-content:center;
margin-bottom:20px;
flex-wrap:wrap;
}

.size-inputs div{
display:flex;
flex-direction:column;
text-align:left;
}

.size-inputs label{
margin-bottom:5px;
font-weight:bold;
}

.size-inputs input{
padding:10px;
border:1px solid #ccc;
border-radius:6px;
width:120px;
}

.tool-btn{
background:#2f5da8;
color:white;
padding:12px 25px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

.tool-btn:hover{
opacity:0.9;
}

/* mobile */

@media (max-width:768px){

.tool-container{
padding:25px;
}

.size-inputs{
flex-direction:column;
align-items:center;
}

.size-inputs input{
width:100%;
max-width:200px;
}

}

</style>


<div class="tool-container">

<h1>🖼 Image Resizer</h1>

<p>Resize images quickly by specifying custom width and height.</p>

<form method="post" enctype="multipart/form-data">

{% csrf_token %}

<div class="upload-box">

<p>Select an image</p>

<input type="file" name="image" required>

</div>


<div class="size-inputs">

<div>
<label>Width (px)</label>
<input type="number" name="width" required>
</div>

<div>
<label>Height (px)</label>
<input type="number" name="height" required>
</div>

</div>


<button type="submit" class="tool-btn">
Resize Image
</button>

</form>

</div>

{% endblock %}
