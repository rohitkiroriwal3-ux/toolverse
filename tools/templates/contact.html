{% extends "base.html" %}

{% block content %}

<style>

.contact-container{
max-width:700px;
margin:auto;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.contact-container h1{
margin-top:0;
color:#243b64;
}

.contact-container p{
color:#555;
margin-bottom:25px;
}

.contact-container label{
display:block;
font-weight:bold;
margin-bottom:6px;
}

.contact-container input,
.contact-container textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
margin-bottom:18px;
font-size:14px;
}

.contact-container textarea{
height:150px;
resize:vertical;
}

.contact-container button{
background:#2f5da8;
color:white;
padding:12px 25px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

.contact-container button:hover{
opacity:0.9;
}

/* mobile */

@media (max-width:768px){

.contact-container{
padding:25px;
}

}

</style>

<div class="contact-container">

<h1>Contact Us</h1>

<p>
If you have any questions, suggestions or feedback,
please contact us using the form below.
</p>

<form method="post">

{% csrf_token %}

<label>Name</label>

<input
type="text"
name="name"
required>

<label>Email</label>

<input
type="email"
name="email"
required>

<label>Message</label>

<textarea
name="message"
required>
</textarea>

<button type="submit">
Send Message
</button>

</form>

</div>

{% endblock %}
